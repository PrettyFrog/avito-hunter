name: "Инструменты и оборудование (tools)"
description: "Пресет для электроинструмента, бензотехники и ручного инструмента"
condition_rubrics:
  - "новый (в кейсе, пломбы, гарантийный талон)"
  - "мало б/у (домашнее использование, без перегрузок)"
  - "рабочее состояние (строительные потертости, обслужен)"
  - "на запчасти / восстановление (искрит, сгорел, заклинил)"
common_pitfalls:
  - "подделка под известный бренд (Makita, DeWalt, Bosch, Milwaukee)"
  - "сгоревший или подгоревший ротор/статор двигателя"
  - "неоригинальные или деградировавшие аккумуляторы (АКБ)"
  - "сильное искрение щеток под нагрузкой"
  - "люфт патрона, биение шпинделя или износ редуктора"
checklist:
  - "подлинность шильдика, серийного номера и шрифтов"
  - "тест работы на холостом ходу и под нагрузкой"
  - "состояние щеточного узла и отсутствие запаха гари"
  - "оригинальность и остаточная емкость аккумуляторов"
  - "комплектность: зарядное устройство, кейс, оснастка"
red_flags:
  - "искрит"
  - "пахнет гарью"
  - "сгорел"
  - "на запчасти"
  - "китайская копия"
  - "аналог макита"
  - "реплика"
  - "копия dewalt"
