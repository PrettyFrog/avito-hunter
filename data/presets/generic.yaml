name: "Общая категория (generic)"
description: "Универсальный пресет для любых потребительских товаров"
condition_rubrics:
  - "новый (в невскрытой заводской упаковке)"
  - "отличное / как новый (без следов использования)"
  - "хорошее (мелкие косметические следы, исправен)"
  - "удовлетворительное (заметный износ/потертости, исправен)"
  - "на запчасти / дефектный (неисправен или требует ремонта)"
common_pitfalls:
  - "реплика / неоригинал / подделка"
  - "скрытые механические или функциональные дефекты"
  - "некомплект (отсутствие ключевых деталей или аксессуаров)"
  - "несоответствие заявленной модели реальному товару"
checklist:
  - "состояние корпуса и внешнего вида"
  - "полнота комплектации"
  - "работоспособность и проверка функций"
red_flags:
  - "реплика"
  - "копия"
  - "1:1"
  - "люкс копия"
  - "не оригинал"
  - "неоригинал"
