name: "Электроника (electronics)"
description: "Пресет для ноутбуков, наушников, смартфонов и цифровой техники"
condition_rubrics:
  - "новый (в заводской пломбе/коробке)"
  - "как новый / отличное (минимальное число циклов, без царапин)"
  - "б/у без дефектов (полностью исправен, косметические следы)"
  - "б/у с износом (потертости корпуса, износ батареи)"
  - "на запчасти / ремонт (не включается, заблокирован, залит)"
common_pitfalls:
  - "блокировки аккаунта (iCloud, Google, MDM, корпоративный профиль, пароль BIOS)"
  - "высокий износ аккумулятора / вздутая батарея"
  - "замена экрана на дешевую копию (без TrueTone / плохая матрица)"
  - "реплика / китайская копия (особенно для наушников и смартфонов)"
  - "следы залития жидкостью или неквалифицированного ремонта"
checklist:
  - "серийный номер и совпадение с коробкой"
  - "отвязка от всех аккаунтов и сброс до заводских настроек"
  - "проверка состояния аккумулятора (емкость / циклы)"
  - "исправность экрана (битые пиксели, засветы, сенсор)"
  - "работоспособность всех портов, кнопок и беспроводных модулей"
  - "комплектный оригинальный блок питания / кабель"
red_flags:
  - "icloud"
  - "mdm"
  - "пароль на bios"
  - "заблокирован"
  - "не включается"
  - "реплика"
  - "паль"
  - "1:1"
  - "копия"
  - "байпас"
  - "демо"
