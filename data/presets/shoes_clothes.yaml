name: "Обувь и одежда (shoes_clothes)"
description: "Пресет для кроссовок, брендовой одежды и аксессуаров"
condition_rubrics:
  - "новое с бирками (в оригинальной коробке с чеком/ордером)"
  - "новое без бирок / примерка"
  - "отличное (1-2 носки, без заломов и пятен)"
  - "хорошее (чистые, следы аккуратной носки, протектор целый)"
  - "удовлетворительное (заметный износ, сбитые носы/пятки)"
common_pitfalls:
  - "реплика / паль / люкс-копия / подделка под оригинал"
  - "стёртая или пробитая подошва / баллон air max"
  - "заломы кожи / потёртости текстиля"
  - "отсутствие родной коробки и дополнительных шнурков"
  - "несоответствие сетки размеров (US, UK, EUR, CM)"
checklist:
  - "артикул модели на внутреннем ярлыке и совпадение с коробкой"
  - "состояние протектора подошвы и стельки"
  - "качество швов, проклейки и логотипов"
  - "наличие родной коробки, чека или легит-чека"
red_flags:
  - "люкс копия"
  - "aaa+"
  - "реплика"
  - "пойзон без ордера"
  - "паль"
  - "реп"
  - "1:1"
  - "копия"
