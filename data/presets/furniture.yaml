name: "Мебель и интерьер (furniture)"
description: "Пресет для столов, стульев, диванов, шкафов и предметов интерьера"
condition_rubrics:
  - "новое (в заводской упаковке / не собиралось)"
  - "отличное (без сколов, царапин и пятен)"
  - "хорошее (мелкие эксплуатационные следы, фурнитура целая)"
  - "требует реставрации / перетяжки"
common_pitfalls:
  - "сколы ЛДСП, трещины массива или шпона"
  - "просиженные пружины / продавившийся ППУ дивана"
  - "сломанный газлифт или механизм качания кресла"
  - "следы когтей домашних животных / въевшиеся запахи"
  - "условия самовывоза: негабарит, отсутствие грузового лифта"
checklist:
  - "целостность обивки, отсутствие зацепок и пятен"
  - "исправность подъемных механизмов, направляющих и фурнитуры"
  - "точные габариты (ширина, глубина, высота)"
  - "разборность конструкции и этаж самовывоза"
red_flags:
  - "пробит"
  - "сломан каркас"
  - "сломан газлифт"
  - "на запчасти"
  - "трещина каркаса"
